# A tag vVERSION, where VERSION is the cli package's version, makes a GitHub
# release: the executables for Linux x64 and arm64, their SHA256SUMS, and the
# notes of that version from CHANGELOG.md. The same checks as CI run first,
# and every executable is started and checked before anything is published.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Only this job may write, and only to publish the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install pnpm, the version package.json names
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - name: The tag names the version being released
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "the tag is $TAG, but packages/cli/package.json says $version" >&2
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      # The sandbox tests need nft and user namespaces without root; the
      # arm64 executable runs under QEMU.
      - name: Prepare the sandbox and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables qemu-user-static libc6-arm64-cross libstdc++6-arm64-cross libatomic1-arm64-cross
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:sea --target linux-x64 --target linux-arm64 --archive --check-all --qemu
      - name: The notes of this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          awk -v head="## $version " 'index($0, head) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.xz dist/SHA256SUMS --verify-tag --title "hopdeck ${TAG#v}" --notes-file dist/NOTES.md
