# hopdeck test host: key logins, with the test key accepted for every account.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/hopdeck_authorized_keys

# The key setup logs in with a password once: the accounts that have one may.
# A Match block runs to the end of its file, so it comes last.
Match User admin,plain
	PasswordAuthentication yes
